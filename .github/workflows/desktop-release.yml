name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    environment: github-release-production
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-26-intel
            platform: macos
            arch: x64
            extension: dmg
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            extension: deb
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            extension: deb
          - runner: windows-2025
            platform: windows
            arch: x64
            extension: msi
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" bash .github/scripts/validate_release_contract.sh
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/kvace.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build installer and JAR
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            ./gradlew :app:desktopApp:packageReleaseDistributionForCurrentOS :app:desktopApp:packageReleaseUberJarForCurrentOS -Pcompose.desktop.mac.sign=true -Pcompose.desktop.mac.signing.identity="$MACOS_SIGNING_IDENTITY" -Pcompose.desktop.mac.signing.keychain="$MACOS_KEYCHAIN"
          else
            ./gradlew :app:desktopApp:packageReleaseDistributionForCurrentOS :app:desktopApp:packageReleaseUberJarForCurrentOS
          fi
      - name: Stage named assets
        shell: bash
        run: |
          source version.properties
          mkdir -p release-assets
          installer_count="$(find app/desktopApp/build/compose/binaries -type f -name '*.${{ matrix.extension }}' | wc -l | tr -d ' ')"
          jar_count="$(find app/desktopApp/build/compose/jars -maxdepth 1 -type f -name '*-release.jar' | wc -l | tr -d ' ')"
          test "$installer_count" -eq 1 && test "$jar_count" -eq 1
          installer="$(find app/desktopApp/build/compose/binaries -type f -name '*.${{ matrix.extension }}')"
          jar="$(find app/desktopApp/build/compose/jars -maxdepth 1 -type f -name '*-release.jar')"
          cp "$installer" "release-assets/Kvace-$VERSION_NAME-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}"
          cp "$jar" "release-assets/Kvace-$VERSION_NAME-${{ matrix.platform }}-${{ matrix.arch }}.jar"
      - if: matrix.platform == 'macos'
        name: Notarize macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="$(find release-assets -name '*.dmg')"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets

  release:
    needs: package
    environment: github-release-production
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - run: cd release-assets && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: release-assets/* }
      - name: Upload assets to the existing draft release
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-assets/*
        env:
          GH_TOKEN: ${{ github.token }}
