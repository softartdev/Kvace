name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bash .github/scripts/validate_release_contract.sh && bash .github/scripts/validate_distribution.sh
      - run: ./gradlew :core:domain:allTests :core:presentation:allTests :feature:agent:domain:allTests :feature:agent:data:allTests :feature:agent:presentation:allTests :feature:chat:domain:allTests :feature:chat:data:allTests :feature:chat:presentation:allTests :feature:settings:domain:allTests :feature:settings:data:allTests :feature:settings:presentation:allTests :app:shared:allTests
      - run: ./gradlew :app:androidApp:lint :app:androidApp:assembleDebug :app:webApp:wasmJsBrowserProductionWebpack
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-reports
          path: '**/build/reports'
          if-no-files-found: ignore
          retention-days: 7

  macos-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 :app:desktopApp:test :app:desktopApp:verifyMacOsFoundationModelsBridge

  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew :app:desktopApp:mainClasses :app:desktopApp:createReleaseDistributable

  ci-gate:
    if: always()
    needs: [ubuntu, macos-arm64, desktop-smoke]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.ubuntu.result }}' = success -a '${{ needs.macos-arm64.result }}' = success -a '${{ needs.desktop-smoke.result }}' = success
